name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Validate repository contracts
        run: python scripts/validate-repository.py
      - name: Validate agent skills
        run: |
          python - <<'PY'
          import pathlib, re, sys
          failed = False
          for path in pathlib.Path("skills").glob("*/SKILL.md"):
              text = path.read_text(encoding="utf-8")
              if not re.match(r"^---\nname: [a-z0-9-]+\ndescription: .+\n---\n", text):
                  print(f"Invalid skill frontmatter: {path}")
                  failed = True
          raise SystemExit(1 if failed else 0)
          PY

  test:
    needs: validate
    strategy:
      matrix:
        node-version: [20, 22]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Smoke-test CLI
        run: |
          node dist/scripts/sciphys.js xrd inspect examples/zno.xy
          node dist/scripts/sciphys.js evidence validate examples/evidence-bundle.example.json
          node dist/scripts/sciphys.js plugin validate registry/plugins/xrd-core.json
